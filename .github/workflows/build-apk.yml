name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build PrepFlow APK via Cordova
        run: |
          cordova create build_app com.minecade.prepflow PrepFlow

          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png
          cp logo.png build_app/logo.png

          cd build_app

          cat << 'CFG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.minecade.prepflow" version="1.1.0" android-versionCode="10100" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>PrepFlow</name>
              <description>11th Science &amp; MHT-CET Tracker</description>
              <author>PrepFlow Team</author>
              <content src="index.html" />
              <preference name="ScrollEnabled" value="true" />
              <preference name="android-minSdkVersion" value="22" />
              <platform name="android">
                  <icon src="logo.png" />
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="logo.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#0b0f17" />
              </platform>
          </widget>
          CFG
          cordova platform add android

          cat << 'JAVA' > platforms/android/app/src/main/java/com/minecade/prepflow/MainActivity.java
          package com.minecade.prepflow;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import org.apache.cordova.CordovaActivity;

          public class MainActivity extends CordovaActivity {
              private static final int CREATE_BACKUP_REQUEST = 48127;
              private String pendingBackupJson;

              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Register after Cordova has attached the WebView. Never touch
                  // appView during the critical Activity startup path.
                  getWindow().getDecorView().post(() -> {
                      if (appView == null || appView.getEngine() == null) return;
                      WebView webView = (WebView) appView.getEngine().getView();
                      if (webView != null) {
                          webView.addJavascriptInterface(new PrepFlowAndroidBridge(), "AndroidPrepFlow");
                      }
                  });
              }

              private void notifyWeb(String message, boolean error) {
                  if (appView == null) return;
                  WebView webView = (WebView) appView.getEngine().getView();
                  String safe = message.replace("\\", "\\\\").replace("'", "\\'");
                  String type = error ? "error" : "info";
                  webView.post(() -> webView.evaluateJavascript(
                      "if(typeof app!=='undefined'&&app){app.showToast('" + safe + "','" + type + "');}", null));
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != CREATE_BACKUP_REQUEST) return;

                  if (resultCode != Activity.RESULT_OK || data == null || data.getData() == null || pendingBackupJson == null) {
                      pendingBackupJson = null;
                      notifyWeb("Backup export cancelled.", false);
                      return;
                  }

                  Uri uri = data.getData();
                  try (OutputStream output = getContentResolver().openOutputStream(uri)) {
                      if (output == null) throw new IllegalStateException("Could not open selected file");
                      output.write(pendingBackupJson.getBytes(StandardCharsets.UTF_8));
                      output.flush();
                      notifyWeb("Backup saved successfully!", false);
                  } catch (Exception error) {
                      error.printStackTrace();
                      notifyWeb("Failed to export backup.", true);
                  } finally {
                      pendingBackupJson = null;
                  }
              }

              public class PrepFlowAndroidBridge {
                  @JavascriptInterface
                  public void exportBackup(String json, String filename) {
                      if (json == null || filename == null) return;

                      runOnUiThread(() -> {
                          pendingBackupJson = json;
                          Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          intent.putExtra(Intent.EXTRA_TITLE, filename);
                          startActivityForResult(intent, CREATE_BACKUP_REQUEST);
                      });
                  }
              }
          }
          JAVA

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
