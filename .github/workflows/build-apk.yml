name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build PrepFlow APK via Cordova
        run: |
          cordova create build_app com.minecade.prepflow PrepFlow

          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png
          cp logo.png build_app/logo.png

          cd build_app

          cat << 'CFG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.minecade.prepflow" version="1.1.1" android-versionCode="10101" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>PrepFlow</name>
              <description>11th Science &amp; MHT-CET Tracker</description>
              <author>PrepFlow Team</author>
              <content src="index.html" />
              <allow-navigation href="*" />
              <preference name="ScrollEnabled" value="true" />
              <preference name="android-minSdkVersion" value="22" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <platform name="android">
                  <icon src="logo.png" />
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="logo.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#0b0f17" />
              </platform>
          </widget>
          CFG

          cordova plugin add cordova-plugin-file
          cordova platform add android

          test -f www/index.html
          test -f www/logo.png

          cordova build android --debug

          test -f platforms/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l platforms/android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/index.html'
          unzip -l platforms/android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/logo.png'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
