name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build PrepFlow APK via Cordova
        run: |
          cordova create build_app com.minecade.prepflow PrepFlow

          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png
          cp logo.png build_app/logo.png

          cd build_app

          # Fixed config.xml: Added the mandatory Android schema namespace
          cat << 'CFG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.minecade.prepflow" version="1.1.0" android-versionCode="10100" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://android.com" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>PrepFlow</name>
              <description>11th Science &amp; MHT-CET Tracker</description>
              <author>PrepFlow Team</author>
              <content src="index.html" />
              <preference name="ScrollEnabled" value="true" />
              <preference name="android-minSdkVersion" value="22" />
              <platform name="android">
                  <icon src="logo.png" />
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="logo.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#0b0f17" />
              </platform>
          </widget>
          CFG

          # FIX 1: Register your custom local plugin FIRST while the environment is clean
          cordova plugin add ../cordova-plugin-prepflow-backup

          # FIX 2: Generate the Android platform shell AFTER the plugin is registered.
          # This forces Cordova to compile the native mappings and copy the files correctly.
          cordova platform add android

          # Verify both halves of the native bridge are properly packaged
          test -f plugins/cordova-plugin-prepflow-backup/www/prepflow-backup.js
          test -f plugins/cordova-plugin-prepflow-backup/src/android/PrepFlowBackup.java
          test -f platforms/android/app/src/main/assets/www/cordova_plugins.js
          grep -q "PrepFlowBackup" platforms/android/app/src/main/assets/www/cordova_plugins.js
          
          # This check will pass now because the compilation structure matches
          grep -q "com.minecade.prepflow.backup.PrepFlowBackup" platforms/android/app/src/main/res/xml/config.xml

          cordova build android --debug


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
