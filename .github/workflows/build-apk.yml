name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build PrepFlow APK via Cordova
        run: |
          cordova create build_app com.prepflow.tracker PrepFlow
          
          # Copy web assets
          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png
          cp logo.png build_app/logo.png

          cd build_app

          # Config mapping icon directly as Android resource
          cat << 'CFG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.prepflow.tracker" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>PrepFlow</name>
              <description>11th Science &amp; MHT-CET Tracker</description>
              <author>PrepFlow Team</author>
              <content src="index.html" />
              <icon src="logo.png" />
              <preference name="ScrollEnabled" value="true" />
              <preference name="android-minSdkVersion" value="22" />
              <preference name="AndroidWindowSplashScreenBackground" value="#0b0f17" />
          </widget>
          CFG

          cordova platform add android

          # Overwrite default bot vector drawables with logo image in Android resources
          RES_DIR="platforms/android/app/src/main/res"
          if [ -d "$RES_DIR" ]; then
            # Replace PNG drawables
            find "$RES_DIR" -name "*splash*" -exec cp ../logo.png {} \;
            find "$RES_DIR" -name "*icon*" -exec cp ../logo.png {} \;
            
            # Remove default vector files that render the Cordova bot on Android 12+
            find "$RES_DIR" -name "ic_cdv_splashscreen.xml" -delete || true
            find "$RES_DIR" -name "ic_launcher_foreground.xml" -delete || true
          fi

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
