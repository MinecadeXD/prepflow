name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build PrepFlow APK via Cordova
        run: |
          cordova create build_app com.prepflow.tracker PrepFlow
          
          # Copy source files
          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png
          cp logo.png build_app/logo.png

          cd build_app

          # Write config.xml with explicit splashscreen icon mapping & dark background
          cat << 'CFG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.prepflow.tracker" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>PrepFlow</name>
              <description>11th Science &amp; MHT-CET Tracker</description>
              <author>PrepFlow Team</author>
              <content src="index.html" />
              <icon src="logo.png" />
              
              <preference name="ScrollEnabled" value="true" />
              <preference name="android-minSdkVersion" value="22" />

              <platform name="android">
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="logo.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#0b0f17" />
                  <preference name="SplashScreenDelay" value="0" />
              </platform>
          </widget>
          CFG

          cordova platform add android@12.0.0

          # Inject dark theme & replace drawable splash resources manually before compilation
          mkdir -p platforms/android/app/src/main/res/mipmap-hdpi
          mkdir -p platforms/android/app/src/main/res/drawable
          
          cp logo.png platforms/android/app/src/main/res/drawable/ic_cdv_splashscreen.png || true
          cp logo.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
