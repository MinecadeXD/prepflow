name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # FIX 1: Install Cordova locally into the runner's project workspace 
      # so it is natively available to npx without path mapping issues.
      - name: Install Cordova Locally
        run: npm install cordova

      - name: Build PrepFlow APK via Cordova
        run: |
          # FIX 2: Prepend all 'cordova' commands with 'npx'
          npx cordova create build_app com.minecade.prepflow PrepFlow

          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png
          cp logo.png build_app/logo.png

          cd build_app

          # Standard Android XML Namespace mapping rules
          # CORRECTED VALUE: Change xmlns:android to the official schemas URL
          cat << 'CFG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.minecade.prepflow" version="1.1.0" android-versionCode="10100" xmlns="http://w3.org" xmlns:android="http://android.com" xmlns:cdv="http://apache.org">
              <name>PrepFlow</name>
              <description>11th Science &amp; MHT-CET Tracker</description>
              <author>PrepFlow Team</author>
              <content src="index.html" />
              <preference name="ScrollEnabled" value="true" />
              <preference name="android-minSdkVersion" value="22" />
              <platform name="android">
                  <icon src="logo.png" />
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="logo.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#0b0f17" />
              </platform>
          </widget>
          CFG

          # Plugins are registered BEFORE the native platform target is added
          npx cordova plugin add ../cordova-plugin-prepflow-backup

          # Platform is compiled AFTER the plugin registration step
          npx cordova platform add android

          # Verify structural dependencies exist prior to deployment
          test -f plugins/cordova-plugin-prepflow-backup/www/prepflow-backup.js
          test -f plugins/cordova-plugin-prepflow-backup/src/android/PrepFlowBackup.java
          test -f platforms/android/app/src/main/assets/www/cordova_plugins.js
          grep -q "PrepFlowBackup" platforms/android/app/src/main/assets/www/cordova_plugins.js
          grep -q "com.minecade.prepflow.backup.PrepFlowBackup" platforms/android/app/src/main/res/xml/config.xml

          npx cordova build android --debug


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
