name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build PrepFlow APK via Cordova
        run: |
          cordova create build_app com.prepflow.tracker PrepFlow
          
          # Copy source files
          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png
          cp logo.png build_app/logo.png

          cd build_app

          # Write config.xml
          cat << 'CFG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.prepflow.tracker" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>PrepFlow</name>
              <description>11th Science &amp; MHT-CET Tracker</description>
              <author>PrepFlow Team</author>
              <content src="index.html" />
              <icon src="logo.png" />
              <preference name="ScrollEnabled" value="true" />
              <preference name="android-minSdkVersion" value="22" />
          </widget>
          CFG

          cordova platform add android

          # Force disable Android Splash Screen Theme directly in native styles.xml
          STYLES_FILE="platforms/android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES_FILE" ]; then
            sed -i 's/parent="Theme.App.Starting"/parent="Theme.AppCompat.NoActionBar"/g' "$STYLES_FILE" || true
            sed -i '/<item name="windowSplashScreenAnimatedIcon">/d' "$STYLES_FILE" || true
            sed -i '/<item name="postSplashScreenTheme">/d' "$STYLES_FILE" || true
          fi

          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
