name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build PrepFlow APK via Cordova
        run: |
          cordova create build_app com.minecade.prepflow PrepFlow

          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png
          cp logo.png build_app/logo.png

          cd build_app

          cat << 'CFG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.minecade.prepflow" version="1.1.0" android-versionCode="10100" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>PrepFlow</name>
              <description>11th Science &amp; MHT-CET Tracker</description>
              <author>PrepFlow Team</author>
              <content src="index.html" />
              <preference name="ScrollEnabled" value="true" />
              <preference name="android-minSdkVersion" value="22" />
              <platform name="android">
                  <icon src="logo.png" />
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="logo.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#0b0f17" />
              </platform>
          </widget>
          CFG
          mkdir -p cordova-plugin-save-backup/www cordova-plugin-save-backup/src/android

          cat << 'PKG' > cordova-plugin-save-backup/package.json
          {
            "name": "cordova-plugin-save-backup",
            "version": "1.0.0",
            "description": "Native Android Save As support for PrepFlow backups",
            "cordova": {
              "id": "com.minecade.prepflow.savebackup",
              "platforms": ["android"]
            },
            "keywords": ["cordova", "backup", "android"],
            "license": "MIT"
          }
          PKG

          cat << 'PLUGIN' > cordova-plugin-save-backup/plugin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <plugin id="com.minecade.prepflow.savebackup" version="1.0.0" xmlns="http://apache.org/cordova/ns/plugins/1.0">
              <name>PrepFlow Save Backup</name>
              <description>Native Android Save As support for PrepFlow backups.</description>
              <js-module src="www/saveBackup.js" name="SaveBackup">
                  <clobbers target="cordova.plugins.saveBackup" />
              </js-module>
              <platform name="android">
                  <source-file src="src/android/SaveBackup.java" target-dir="src/com/minecade/prepflow/savebackup" />
              </platform>
          </plugin>
          PLUGIN

          cat << 'PLUGINJS' > cordova-plugin-save-backup/www/saveBackup.js
          var exec = require('cordova/exec');
          module.exports = {
            create: function (json, fileName, success, error) {
              exec(success || function () {}, error || function () {}, 'SaveBackup', 'create', [json, fileName]);
            },
            open: function (success, error) {
              exec(success || function () {}, error || function () {}, 'SaveBackup', 'open', []);
            }
          };
          PLUGINJS

          cat << 'JAVA' > cordova-plugin-save-backup/src/android/SaveBackup.java
          package com.minecade.prepflow.savebackup;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.ByteArrayOutputStream;
          import java.nio.charset.StandardCharsets;
          import org.apache.cordova.CallbackContext;
          import org.apache.cordova.CordovaPlugin;
          import org.json.JSONArray;
          import org.json.JSONException;

          public class SaveBackup extends CordovaPlugin {
              private static final int CREATE_DOCUMENT_REQUEST = 48127;
              private static final int OPEN_DOCUMENT_REQUEST = 48128;
              private CallbackContext pendingCallback;
              private String pendingJson;
              private boolean pendingOpen;

              @Override
              public boolean execute(String action, JSONArray args, CallbackContext callbackContext) throws JSONException {
                  if ("create".equals(action)) {
                      pendingCallback = callbackContext;
                      pendingJson = args.getString(0);
                      pendingOpen = false;
                      String fileName = args.optString(1, "prepflow_backup.json");

                      Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("application/json");
                      intent.putExtra(Intent.EXTRA_TITLE, fileName);
                      cordova.getActivity().startActivityForResult(intent, CREATE_DOCUMENT_REQUEST);
                      return true;
                  }

                  if ("open".equals(action)) {
                      pendingCallback = callbackContext;
                      pendingJson = null;
                      pendingOpen = true;

                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("application/json");
                      cordova.getActivity().startActivityForResult(intent, OPEN_DOCUMENT_REQUEST);
                      return true;
                  }

                  return false;
              }

              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  if (pendingCallback == null) return;
                  if (requestCode != CREATE_DOCUMENT_REQUEST && requestCode != OPEN_DOCUMENT_REQUEST) return;

                  CallbackContext callback = pendingCallback;
                  String json = pendingJson;
                  boolean opening = pendingOpen;
                  pendingCallback = null;
                  pendingJson = null;
                  pendingOpen = false;

                  if (resultCode != Activity.RESULT_OK || intent == null || intent.getData() == null) {
                      callback.error(opening ? "Open cancelled" : "Save cancelled");
                      return;
                  }

                  Uri uri = intent.getData();

                  if (opening) {
                      try (InputStream input = cordova.getActivity().getContentResolver().openInputStream(uri)) {
                          if (input == null) {
                              callback.error("Could not open selected backup");
                              return;
                          }

                          ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                          byte[] data = new byte[8192];
                          int count;
                          while ((count = input.read(data)) != -1) {
                              buffer.write(data, 0, count);
                          }

                          callback.success(buffer.toString(StandardCharsets.UTF_8.name()));
                      } catch (Exception e) {
                          callback.error("Could not read backup: " + e.getMessage());
                      }
                      return;
                  }

                  try (OutputStream output = cordova.getActivity().getContentResolver().openOutputStream(uri)) {
                      if (output == null) {
                          callback.error("Could not open selected save location");
                          return;
                      }
                      output.write(json.getBytes(StandardCharsets.UTF_8));
                      output.flush();
                      callback.success("Backup saved");
                  } catch (Exception e) {
                      callback.error("Could not save backup: " + e.getMessage());
                  }
              }
          }
          JAVA

          cordova plugin add ./cordova-plugin-save-backup
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
