name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build PrepFlow APK via Cordova
        run: |
          cordova create build_app com.prepflow.tracker PrepFlow
          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png

          # Replace default app icon with logo.png if present
          if [ -f logo.png ]; then
            cp logo.png build_app/www/res/icon.png || true
          fi

          cd build_app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PrepFlow-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
