name: Build PrepFlow APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova Locally
        run: npm install cordova

      - name: Build PrepFlow APK via Cordova
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npx cordova create build_app com.minecade.prepflow PrepFlow

          cp index.html build_app/www/index.html
          cp logo.png build_app/www/logo.png
          cp logo.png build_app/logo.png

          cd build_app

          cat << 'CFG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.minecade.prepflow" version="1.17.2" android-versionCode="11702" xmlns="http://w3.org" xmlns:android="http://android.com" xmlns:cdv="http://apache.org">
              <name>PrepFlow</name>
              <description>11th Science &amp; MHT-CET Tracker</description>
              <author>PrepFlow Team</author>
              <content src="index.html" />
              <preference name="ScrollEnabled" value="true" />
              <preference name="android-minSdkVersion" value="22" />
              <platform name="android">
                  <icon src="logo.png" />
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="logo.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#0b0f17" />
              </platform>
          </widget>
          CFG

          npx cordova plugin add ../cordova-plugin-prepflow-backup
          npx cordova platform add android

          test -f plugins/cordova-plugin-prepflow-backup/www/prepflow-backup.js
          test -f plugins/cordova-plugin-prepflow-backup/src/android/PrepFlowBackup.java
          test -f platforms/android/app/src/main/assets/www/cordova_plugins.js
          grep -q "PrepFlowBackup" platforms/android/app/src/main/assets/www/cordova_plugins.js
          grep -q "com.minecade.prepflow.backup.PrepFlowBackup" platforms/android/app/src/main/res/xml/config.xml

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > prepflow-release.keystore
          chmod 600 prepflow-release.keystore

          cat << EOF > build.json
          {
            "android": {
              "release": {
                "keystore": "prepflow-release.keystore",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD",
                "keystoreType": "jks"
              }
            }
          }
          EOF

          npx cordova build android --release --buildConfig=build.json -- --packageType=apk

          test -f platforms/android/app/build/outputs/apk/release/app-release.apk

          rm -f prepflow-release.keystore build.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrepFlow-Release-APK
          path: build_app/platforms/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
